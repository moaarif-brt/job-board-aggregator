name: Update Job Listings

on:
  schedule:
    - cron: "33 7 * * *"
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          shard_counts = {
              # "workday": 20,
              # "greenhouse": 12,
              # "icims": 12,
              # "bamboohr": 10,
              # "lever": 8,
              "ashby": 8,
              "workable": 8,
              "recruitee": 6,
              # "personio": 6,
              # "smartrecruiters": 6,
              # "jazzhr": 6,
              # "pinpoint": 6,
          }
          include = [
              {"platform": platform, "shard_index": shard, "shard_count": count}
              for platform, count in shard_counts.items()
              for shard in range(count)
          ]
          print("matrix=" + json.dumps({"include": include}))
          PY

  scrape:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper shard
        run: |
          OUT="scripts/output/${{ matrix.platform }}-${{ matrix.shard_index }}"
          python scripts/scraper.py \
            --source automated \
            --platform "${{ matrix.platform }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count "${{ matrix.shard_count }}" \
            --priority daily,every_3_days \
            --output-dir "$OUT"
          cp "data/company_status/${{ matrix.platform }}.json" "$OUT/status_${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: scrape-output-${{ matrix.platform }}-${{ matrix.shard_index }}
          path: scripts/output/${{ matrix.platform }}-${{ matrix.shard_index }}
          retention-days: 2

  merge-and-publish:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          path: scripts/artifacts

      - name: Restore job validation cache
        id: validation-cache
        uses: actions/cache/restore@v4
        with:
          path: data/job_validation_cache.json
          key: job-validation-${{ github.run_id }}
          restore-keys: |
            job-validation-

      - name: Merge shard status
        run: python scripts/merge_company_status.py --artifacts-dir scripts/artifacts

      - name: Merge job artifacts
        run: python scripts/merge_data.py --artifacts-dir scripts/artifacts --existing-data-dir data --output-dir data --validation-workers 24 --min-health-score 90

      - name: Save job validation cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: data/job_validation_cache.json
          key: job-validation-${{ github.run_id }}

      - name: Publish chunks to Cloudflare R2
        run: python scripts/publish_r2.py --chunks-dir data/chunks --prefix jobs --metadata data/metadata.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

      - name: Save trend snapshot
        run: |
          mkdir -p data/trends
          python - <<'PY'
          import gzip, json
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          chunks_dir = Path("data/chunks")
          manifest = json.loads((chunks_dir / "jobs_manifest.json").read_text())
          jobs = []
          for name in manifest["chunks"]:
              with gzip.open(chunks_dir / name, "rt", encoding="utf-8") as f:
                  jobs.extend(json.load(f))
          by_platform = Counter(job.get("ats", "Unknown").lower().replace(" ", "_") for job in jobs)
          by_tier = Counter(job.get("skill_level", "unknown") for job in jobs)
          metadata = json.loads(Path("data/metadata.json").read_text())
          event = {
              "date": datetime.now(timezone.utc).date().isoformat(),
              "total_jobs": len(jobs),
              "active_companies": metadata.get("active_companies", 0),
              "recruiter_jobs": metadata.get("recruiter_jobs", 0),
              "r2_manifest_url": metadata.get("r2_manifest_url"),
              "by_platform": dict(by_platform),
              "by_tier": dict(by_tier),
          }
          with Path("data/trends/daily.jsonl").open("a", encoding="utf-8") as f:
              f.write(json.dumps(event) + "\n")
          PY

      - name: Commit small registry and metadata updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/config.json data/metadata.json data/trends/ data/company_status/ data/companies/ data/*_companies.json
          git diff --staged --quiet || git commit -m "Automated sharded scrape + R2 publish - $(date +'%Y-%m-%d %H:%M UTC')"
          git push
